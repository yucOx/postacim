# TLS variant — mounted over the default conf via docker-compose.tls.yml.
# Certs are read from /certs (fullchain.pem + privkey.pem); see scripts/gen-certs.sh
# for a self-signed pair or mount real Let's Encrypt certs in production.

# plain HTTP only redirects to HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- security headers (HSTS only ever sent over TLS) ---
    # 'wasm-unsafe-eval' is REQUIRED: hash-wasm (Argon2id KDF) and libsodium
    # compile WASM at runtime — without it every login/registration dies.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — LiveKit is proxied same-origin (/livekit): connect-src pinned to
    # 'self'. Separate-origin SFU deployment → append its wss:// host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # API -> node server
    # X-Forwarded-For: OVERWRITE ($remote_addr), never $proxy_add_x_forwarded_for
    # (append) — appended client XFF + Fastify trustProxy let a forged header
    # mint fresh rate-limit buckets (unlimited register/login).
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket -> node server (secure upgrade)
    location /ws {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # LiveKit signaling (WSS) -> livekit on the host network
    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }
}
