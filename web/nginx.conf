server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- security headers ---
    # CSP: scripts/styles only from ourselves; workers+media need blob: (SFrame
    # E2EE worker, local camera/mic tracks). LiveKit is proxied same-origin at
    # /livekit, so connect-src is pinned to 'self' — a compromised dependency
    # cannot phone home. If you host LiveKit on a separate origin, append it
    # (e.g. wss://sfu.example.com). 'wasm-unsafe-eval' is REQUIRED: hash-wasm
    # (Argon2id KDF) and libsodium compile WASM at runtime — without it every
    # login/registration dies in the browser. challenges.cloudflare.com is the
    # optional Turnstile human check (script + its iframe; connect-src for the
    # token fetch) — only loaded when the build has VITE_TURNSTILE_SITEKEY.
    # require-trusted-types-for: the app never uses innerHTML/eval sinks, so all
    # DOM XSS injection points are rejected at runtime by default. trusted-types
    # allowlist: only the E2EE worker's URL policy (web/src/lib/ttWorker.ts) may
    # be minted — injected script cannot create its own pass-through policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types e2ee-worker" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # API -> node server
    # X-Forwarded-For: OVERWRITE ($remote_addr), never $proxy_add_x_forwarded_for
    # (append). Appending preserves a client-supplied XFF; with Fastify
    # trustProxy:true the leftmost entry wins, so a forged header gave every
    # request a fresh rate-limit bucket — unlimited register/login attempts.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> node server
    location /ws {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # LiveKit signaling (WS) -> livekit on the host network
    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }
}
