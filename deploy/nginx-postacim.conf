# postacim — host nginx (docker compose DIŞI, elle kurulum)
#
# Zincir: client → (bu nginx :80) ─┬─ /api, /ws  → server   (127.0.0.1:4000)
#                                  └─ diğer her şey → docker web (127.0.0.1:8080)
#                                                     web nginx /livekit'i SFU'ya,
#                                                     statik dosyaları serve eder
#
# XFF KURALI (güvenlik): X-Forwarded-For'u YAZAN TEK yer bu dosya —
# $remote_addr ile OVERWRITE (append asla). Fastify trustProxy:true leftmost
# okur; forged XFF yeni rate-limit bucket'ı basamaz. Server portu yalnız
# 127.0.0.1'e publish — XFF'yi bypass edecek doğrudan yol yok.
#
# Kurulum:
#   1. server_name'i kendi domain'inle değiştir
#   2. sudo cp deploy/nginx-postacim.conf /etc/nginx/sites-available/postacim
#   3. sudo ln -s /etc/nginx/sites-available/postacim /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. SSL (certbot otomatik yazar; 443 + redirect, yenileme timer'ı dahil):
#      sudo apt install certbot python3-certbot-nginx
#      sudo certbot --nginx -d postacim.example.com

# WebSocket upgrade için
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name postacim.example.com;   # ← KENDİ DOMAIN'İN

    # avatar yükleme vb. gövdelere pay
    client_max_body_size 10m;

    # ACME challenge — certbot webroot modu kullanırsa
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API — server container'a DİREKT (XFF'yi burada yazıyoruz; docker web'in
    # nginx'i bu yoldan devre dışı, çift-proxy XFF karışıklığı yok)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # ← TEK yazan burası
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — server container'a direkt
    # Upgrade=$http_upgrade (gerçek "websocket" değeri iletilir);
    # Connection=map çıktısı. Tersi ws kütüphanesinde 'Invalid Upgrade
    # header' 400'ü üretir.
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # diğer her şey (statik + /livekit) — docker web'e; iç nginx yol bazlı
    # yönlendirmeyi yapıyor (statik + /livekit → SFU)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
