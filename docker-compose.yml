name: postacim

services:
  livekit:
    image: livekit/livekit-server:v1.13.1
    # keys come from env so compose .env is the single source of truth
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_SECRET:-pgv-dev-secret-please-change-me-0123456789abcdef}"
    # Linux: host network so RTC UDP ranges need no port mapping.
    # Non-Linux: drop network_mode, map 7880+7881/tcp, 50000-50100/udp, 3478/udp
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    # === 2 vCPU optimizasyonu ===
    # LiveKit'i tam core 0'a sabitle — context switch/cache miss sıfır,
    # %15-25 throughput artışı. Diğer core'da Node server çalışır.
    cpuset: "0"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      DATA_DIR: /data
      # browser-facing LiveKit URL — proxied through web at /livekit, so the
      # same origin works everywhere (http or https). For remote deploy set it
      # to the machine's reachable address, e.g. http://192.168.1.10/livekit
      # (with the TLS overlay: https://192.168.1.10/livekit)
      LIVEKIT_URL: ${LIVEKIT_URL:-http://localhost/livekit}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET:-pgv-dev-secret-please-change-me-0123456789abcdef}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # ekran paylaşımı kill switch — .env'de SCREEN_SHARE=off ile kapatılır
      SCREEN_SHARE: ${SCREEN_SHARE:-on}
      REGISTER_RATE_PER_HOUR: ${REGISTER_RATE_PER_HOUR:-3}
      # === 2 vCPU/3 GB optimizasyonu (docs/NETWORKING.md) ===
      # JSON serialize + dosya I/O yükünü %5-10 azaltır. .env ile override.
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ./data:/data
    expose:
      - "4000"
    # host nginx (deploy/nginx-postacim.conf) /api + /ws'yi buraya propler —
    # 127.0.0.1'e bağlı: dış dünyadan bypass imkansız, yalnız host içi.
    # VPS-kalkan + WireGuard tüneli kurulumunda SERVER_HOST=10.10.0.2 (WG IP)
    ports:
      - "${SERVER_HOST:-127.0.0.1}:4000:4000"
    # LiveKit core 0 → server core 1. Cpuset yalnız Linux host'larda etkili.
    cpuset: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # bot-koruması (Turnstile) — .env'de VITE_TURNSTILE_SITEKEY girilirse derlenir
      args:
        VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY:-}
    ports:
      # WEB_HOST default 127.0.0.1: host nginx tek giriş; LAN'e açmak isteyen
      # .env'de WEB_HOST=0.0.0.0 yapar (host nginx'siz mod)
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    # livekit runs on the host network; resolve it from the proxy container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    restart: unless-stopped

  # Opsiyonel: Netdata (sistem izleme) — 2 vCPU/3 GB prod hedefinde
  # varsayılan KAPALI (~50-100 MB RAM + sürekli sys collector).
  # Yerel geliştirme/kurulum doğrulaması için:
  #   docker compose --profile monitoring up -d
  # Grafikler: http://localhost:19999 (localhost only — domain'e açma).
  netdata:
    image: netdata/netdata
    container_name: netdata
    hostname: postacim
    profiles: ["monitoring"]   # 'compose up' ile başlamaz, --profile ister
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
    restart: unless-stopped

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
