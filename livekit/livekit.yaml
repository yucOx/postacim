port: 7880
# Prometheus metrikleri (track/oda/bayt sayıları) — yalnız localhost'tan
# erişilebilir; Netdata/scraper bu portu okur. Dışarıya açma!
prometheus_port: 6789
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # LAN/dev; set true + external_ip for public NAT deployments
  use_external_ip: false
turn:
  # embedded TURN covers symmetric-NAT cases where direct ICE fails
  enabled: true
  udp_port: 3478
